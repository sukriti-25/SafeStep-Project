<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile | SafeStep</title>
    <link rel="icon" href="assets/images/safestep-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/portal.css" />
    <script src="js/portal.js" defer></script>
  </head>
  <body data-page="profile" data-require-role="learner">
    <a class="portal-skip" href="#portal-content">Skip to profile</a>
    <div class="portal-shell">
      <aside class="portal-sidebar" aria-label="Learner navigation">
        <a class="portal-brand" href="dashboard.html"
          ><img
            src="assets/images/safestep-logo.png"
            alt="SafeStep logo"
          /><span
            ><strong>SafeStep</strong><small>Learner portal</small></span
          ></a
        >
        <nav class="portal-nav">
          <a href="dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
          <a href="dashboard.html#my-learning"
            ><span class="nav-icon">▤</span>My Learning</a
          >
          <a href="certificate.html"
            ><span class="nav-icon">◆</span>Certificate</a
          >
          <a href="profile.html" aria-current="page"
            ><span class="nav-icon">●</span>Profile</a
          >
          <a href="help.html"><span class="nav-icon">?</span>Help</a>
        </nav>
        <div class="portal-sidebar-footer">
          <nav class="portal-nav">
            <button type="button" data-logout>
              <span class="nav-icon">↪</span>Log out
            </button>
          </nav>
        </div>
      </aside>
      <main class="portal-main" id="portal-content">
        <header class="portal-topbar">
          <a class="portal-mobile-brand" href="dashboard.html"
            ><img src="assets/images/safestep-logo.png" alt="" />SafeStep</a
          >
          <span class="portal-date" data-current-date></span>
          <div class="portal-user">
            <span class="portal-avatar" data-user-initials></span>
            <div>
              <strong data-user-name></strong><small data-user-role></small>
            </div>
          </div>
          <button class="secondary topbar-logout" type="button" data-logout>
            Log out
          </button>
        </header>
        <div class="portal-content">
          <header class="portal-page-title">
            <div>
              <span class="portal-kicker">Account settings</span>
              <h1>My profile</h1>
              <p>
                Keep your learner details accurate for your training
                certificate.
              </p>
            </div>
          </header>
          <div class="profile-grid">
            <section class="portal-card" aria-labelledby="details-title">
              <h2 id="details-title">Personal information</h2>
              <form data-profile-form>
                <div class="form-grid">
                  <div class="field full">
                    <label for="profile-name">Full name</label
                    ><input id="profile-name" name="name" required />
                  </div>
                  <div class="field">
                    <label for="profile-email">Email address</label
                    ><input
                      id="profile-email"
                      name="email"
                      type="email"
                      required
                    />
                  </div>
                  <div class="field">
                    <label for="profile-phone">Phone number</label
                    ><input id="profile-phone" name="phone" type="tel" />
                  </div>
                  <div class="field">
                    <label for="profile-organisation">Organisation</label
                    ><input id="profile-organisation" name="organisation" />
                  </div>
                  <div class="field">
                    <label for="profile-role">Account role</label
                    ><input id="profile-role" name="role" readonly />
                  </div>
                </div>
                <p class="form-message" role="status" data-form-message></p>
                <button type="submit">Update profile →</button>
              </form>
            </section>
            <aside class="portal-card profile-summary">
              <span class="portal-avatar" data-user-initials></span>
              <h2 data-user-name></h2>
              <p>SafeStep learner</p>
              <div class="profile-detail">
                <span>Email</span><strong data-profile-email></strong>
              </div>
              <div class="profile-detail">
                <span>Organisation</span
                ><strong data-profile-organisation></strong>
              </div>
              <div class="profile-detail">
                <span>Certificate name</span><strong data-user-name></strong>
              </div>
            </aside>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
